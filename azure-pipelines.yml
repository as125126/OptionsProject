# ========================================================
# 1. 自動排程設定 (Scheduled Trigger)
# ========================================================
schedules:
- cron: "30 7 * * *" # UTC 07:30 = 台灣時間 15:30
  displayName: "每日期權報表自動化執行"
  branches:
    include:
    - main
  always: true # 即使代碼沒更新，時間到也會準時執行

# ========================================================
# 2. 代碼變動觸發設定 (Push Trigger)
# ========================================================
trigger:
- main # 當你 Push 代碼到 main 分支時，也會立刻跑一次測試

# ========================================================
# 3. 執行環境設定
# ========================================================
pool:
  vmImage: 'ubuntu-latest' # 使用微軟提供的免費 Linux 虛擬機

# ========================================================
# 4. 執行步驟
# ========================================================
steps:
# 步驟 A: 設定 Python 環境
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.10' 
  displayName: '設定 Python 3.10 環境'

# 步驟 B: 安裝必要套件
- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: '安裝必要套件 (pandas, requests, pymssql...)'

# 步驟 C: 執行主程式
- script: |
    python main.py
  displayName: '執行期權爬蟲與發送報表'
  env:
    # 這裡將 Pipeline 變數「注入」為環境變數供 Python 讀取
    # 請確保你在 Variables 後台已經設定了這些名稱
    DB_PWD: $(DB_PWD)
    SMTP_SERVER: $(SMTP_SERVER)
    SMTP_PORT: $(SMTP_PORT)
    SENDER_EMAIL: $(SENDER_EMAIL)
    SENDER_PASSWORD: $(SENDER_PASSWORD)