# ========================================================
# 1. 自動排程設定 (Scheduled Trigger)
# ========================================================
schedules:
- cron: "30 7 * * *" # UTC 07:30 = 台灣時間 15:30
  displayName: "每日期權報表自動化執行"
  branches:
    include:
    - main
  always: true 

# ========================================================
# 2. 代碼變動觸發設定 (Push Trigger)
# ========================================================
trigger:
- main 

# ========================================================
# 3. 執行環境設定
# ========================================================
pool:
  vmImage: 'ubuntu-latest' 

# ========================================================
# 4. 執行步驟
# ========================================================
steps:
# 步驟 A: 設定 Python 環境
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.10' 
  displayName: '設定 Python 3.10 環境'

# 步驟 B: 安裝 Linux 系統級別的 ODBC 驅動程式 (解決你的報錯關鍵)
- script: |
    sudo curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
    sudo curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list > ./mssql-release.list
    sudo mv ./mssql-release.list /etc/apt/sources.list.d/
    sudo apt-get update
    sudo ACCEPT_EULA=Y apt-get install -y msodbcsql17 unixodbc-dev
  displayName: '安裝 Microsoft ODBC Driver 17 for SQL Server'

# 步驟 C: 安裝 Python 必要套件
- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: '安裝 Python 必要套件 (pandas, pyodbc...)'

# 步驟 D: 執行主程式
- script: |
    python main.py
  displayName: '執行期權爬蟲與發送報表'
  env:
    # 這裡連動你 Variables 後台設定的變數名稱
    DB_PWD: $(DB_PWD)
    SMTP_SERVER: $(SMTP_SERVER)
    SMTP_PORT: $(SMTP_PORT)
    SENDER_EMAIL: $(SENDER_EMAIL)
    SENDER_PASSWORD: $(SENDER_PASSWORD)